server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Compresión gzip para assets de texto
    gzip            on;
    gzip_types      text/plain text/css application/javascript application/json
                    image/svg+xml font/woff2;
    gzip_min_length 1024;

    # Cache agresiva para assets con hash en el nombre (generados por Vite)
    location ~* \.(js|css|woff2?|ttf|otf|eot|svg|ico|png|jpg|webp|gif)$ {
        expires     1y;
        add_header  Cache-Control "public, immutable";
        access_log  off;
    }

    # SPA fallback: todas las rutas no resueltas sirven index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
